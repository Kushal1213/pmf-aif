<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MF Analytics: Indian mutual fund screener and NAV analytics</title>
  <meta name="description" content="Screen, analyse and compare Indian mutual funds from daily NAV history: returns, risk, rolling returns, SIP XIRR and category indices.">
  <meta name="theme-color" content="#020617">
  <meta property="og:title" content="MF Analytics">
  <meta property="og:description" content="Indian mutual fund screener and NAV analytics.">
  <meta property="og:type" content="website">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script>try { var t = localStorage.getItem("mf.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="#/" aria-label="MF Analytics home">
        <span class="brand-mark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-6 4 3 6-8 3 3"/></svg></span>
        <span>MF Analytics</span>
      </a>
      <nav class="tabs" aria-label="Main">
        <a href="#/" data-tab="screener">Screener</a>
        <a href="#/categories" data-tab="categories">Categories</a>
        <a href="#/compare" data-tab="compare">Compare <span id="cmp-count" class="pill" hidden></span></a>
      </nav>
      <div class="qs" role="search">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label for="qs-input" class="sr-only">Find a scheme</label>
        <input id="qs-input" type="search" placeholder="Find a scheme" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="qs-list" aria-autocomplete="list">
        <kbd aria-hidden="true">/</kbd>
        <ul id="qs-list" class="qs-list" role="listbox" hidden></ul>
      </div>
      <div class="top-tools">
        <div id="busy" class="busy" aria-hidden="true"></div>
        <button id="theme" class="ghost icon" type="button" aria-label="Switch to light theme" aria-pressed="false">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="view" class="wrap" tabindex="-1" aria-live="polite"></main>
  <footer class="wrap foot">
    <span id="health" class="muted"><span class="status-dot"></span>Checking data…</span>
    <span class="muted">NAV-based analytics, not investment advice. Returns over 1 year are annualised. <a href="/docs">API docs</a></span>
  </footer>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/static/vendor/lottie_light.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</body>
</html>
