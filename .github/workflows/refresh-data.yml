# Daily data refresh for the hosted app (free: GitHub Actions on a public repo + a private Hugging Face dataset).
# Restores the hosted snapshot, pulls new NAVs from mfapi.in, recomputes metrics, trims to the hosted size
# and publishes a new snapshot; the Render service notices the new revision and restarts onto it.
#
# Setup (repo Settings -> Secrets and variables -> Actions):
#   secret   HF_TOKEN       fine-grained Hugging Face token with write access to the dataset below
#   variable SNAPSHOT_REPO  e.g. kushal11111/mf-analytics-data
name: Refresh NAV data

on:
  schedule:
    - cron: "30 1 * * *"     # 07:00 IST daily: AMFI NAVs for the previous day are published by then
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330     # a first run with no snapshot bootstraps the full history (~2.5 h)
    env:
      DATABASE_URL: sqlite:///data/mf.db
      SNAPSHOT_REPO: ${{ vars.SNAPSHOT_REPO }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Check configuration
        run: |
          test -n "$SNAPSHOT_REPO" || { echo "::error::set the SNAPSHOT_REPO repository variable"; exit 1; }
          test -n "$HF_TOKEN" || { echo "::error::set the HF_TOKEN repository secret"; exit 1; }
      - name: Restore hosted snapshot
        run: python -m app.ingest restore --repo "$SNAPSHOT_REPO" || echo "No snapshot yet; the refresh will load full history."
      - name: Refresh from mfapi.in
        run: python -m app.ingest refresh --rps 6 --concurrency 8 --with-metrics
      - name: Trim to hosted size
        run: python -m app.ingest export --out data/hosted.db --years 5
      - name: Publish snapshot
        run: python -m app.ingest snapshot --db data/hosted.db --out snapshot/mf.db.gz --repo "$SNAPSHOT_REPO"
      - name: Summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import sqlite3
          c = sqlite3.connect("data/hosted.db")
          n, rows, last = c.execute("select (select count(*) from schemes), (select count(*) from navs), (select max(last_nav_date) from schemes)").fetchone()
          print(f"### NAV data refreshed\n\n- schemes: {n:,}\n- NAV rows (hosted): {rows:,}\n- latest NAV date: {last}")
          EOF
